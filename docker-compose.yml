

services:
  frontend:
    build: 
      context: ./images/Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5003
    depends_on:
      - backend

  backend:
    build: 
      context: ./images/Backend
      dockerfile: Dockerfile
    ports:
      - "5003:5005"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/petlog
      - NODE_ENV=development

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
