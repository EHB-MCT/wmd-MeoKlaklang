<!DOCTYPE html>
<html>
<head>
    <title>Test Admin Flow</title>
</head>
<body>
    <h1>Testing Admin Flow</h1>
    <button onclick="testLogin()">Test Login as Admin</button>
    <button onclick="checkAdminButton()">Test Admin Button</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            try {
                const response = await fetch('http://localhost:5005/api/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name: 'testadmin', password: 'admin123' })
                });
                
                const data = await response.json();
                
                // Simulate what Login.jsx does
                localStorage.setItem("userId", data._id);
                localStorage.setItem("userName", data.name);
                localStorage.setItem("userRole", data.role || 'user');
                
                document.getElementById('result').innerHTML = 
                    `<h3>Login Successful!</h3>
                     <p>User ID: ${data._id}</p>
                     <p>Name: ${data.name}</p>
                     <p>Role: ${data.role}</p>
                     <p>Stored in localStorage as userRole: ${localStorage.getItem('userRole')}</p>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
        
        function checkAdminButton() {
            const userRole = localStorage.getItem("userRole");
            
            // Simulate what Profile.jsx handleAdminClick does
            if (userRole === "admin" || userRole === "manager") {
                alert("Would navigate to /admin/dashboard (direct access!)");
            } else {
                alert("Would navigate to /admin/login (needs login)");
            }
        }
    </script>
</body>
</html>
