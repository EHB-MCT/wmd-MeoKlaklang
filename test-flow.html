<!DOCTYPE html>
<html>
<head>
    <title>Admin Button Flow Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; background: #f0f0f0; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Testing Admin Button Flow</h1>
    
    <h2>Step 1: Login as Admin</h2>
    <button onclick="loginAsAdmin()">Login as testadmin</button>
    
    <h2>Step 2: Test Admin Button Logic</h2>
    <button onclick="testAdminButton()">Simulate Admin Button Click</button>
    
    <h2>Step 3: Check localStorage</h2>
    <button onclick="checkLocalStorage()">Show Current State</button>
    
    <div id="result" class="result">
        <p>Click the buttons above to test the flow...</p>
    </div>

    <script>
        // Simulate the exact logic from Profile.jsx
        function handleAdminClick() {
            const userRole = localStorage.getItem("userRole");
            
            if (userRole === "admin" || userRole === "manager") {
                return "admin/dashboard";  // Would navigate directly to admin dashboard
            } else {
                return "admin/login";     // Would navigate to admin login
            }
        }

        async function loginAsAdmin() {
            try {
                const response = await fetch('http://localhost:5005/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: 'testadmin', password: 'admin123' })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Simulate Login.jsx storing data
                    localStorage.setItem("userId", data._id);
                    localStorage.setItem("userName", data.name);
                    localStorage.setItem("userRole", data.role || 'user');
                    
                    document.getElementById('result').innerHTML = 
                        `<div class="success">
                            <h3>✅ Login Successful!</h3>
                            <p><strong>User ID:</strong> ${data._id}</p>
                            <p><strong>Name:</strong> ${data.name}</p>
                            <p><strong>Role:</strong> ${data.role}</p>
                            <p><strong>Stored in localStorage userRole:</strong> ${localStorage.getItem('userRole')}</p>
                        </div>`;
                } else {
                    document.getElementById('result').innerHTML = 
                        `<div class="error">❌ Login failed: ${data.error}</div>`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function testAdminButton() {
            const destination = handleAdminClick();
            const userRole = localStorage.getItem("userRole");
            
            document.getElementById('result').innerHTML = 
                `<div class="${destination === 'admin/dashboard' ? 'success' : 'error'}">
                    <h3>Admin Button Test Result:</h3>
                    <p><strong>Current userRole:</strong> ${userRole || 'null'}</p>
                    <p><strong>Would navigate to:</strong> ${destination}</p>
                    <p><strong>Expected behavior:</strong> ${destination === 'admin/dashboard' ? 
                        '✅ GOES DIRECTLY TO ADMIN DASHBOARD (no second login needed!)' : 
                        '❌ Would require admin login'}</p>
                </div>`;
        }
        
        function checkLocalStorage() {
            const userId = localStorage.getItem("userId");
            const userName = localStorage.getItem("userName");
            const userRole = localStorage.getItem("userRole");
            
            document.getElementById('result').innerHTML = 
                `<h3>Current localStorage State:</h3>
                 <p><strong>userId:</strong> ${userId || 'null'}</p>
                 <p><strong>userName:</strong> ${userName || 'null'}</p>
                 <p><strong>userRole:</strong> ${userRole || 'null'}</p>`;
        }
    </script>
</body>
</html>
