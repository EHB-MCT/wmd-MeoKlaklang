version: "3.8"

services:
  frontend:
    build: 
      context: ./images/Frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./images/Frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5005
    depends_on:
      - backend

  backend:
    build: 
      context: ./images/Backend
      dockerfile: Dockerfile.dev
    ports:
      - "5005:5002"
    volumes:
      - ./images/Backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/petlog
      - NODE_ENV=development

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: